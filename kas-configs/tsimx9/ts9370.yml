target:
  - core-image-minimal
  - core-image-base
  - imx-image-core

local_conf_header:
  custom-local-conf: |
    ACCEPT_FSL_EULA = "1"
    BB_NUMBER_THREADS = "64"
    PARALLEL_MAKE = "-j 128"
    PACKAGE_CLASSES = "package_deb"
    EXTRA_IMAGE_FEATURES += "package-management"
    # Added just for development
    EXTRA_IMAGE_FEATURES += "allow-empty-password allow-root-login empty-root-password"
